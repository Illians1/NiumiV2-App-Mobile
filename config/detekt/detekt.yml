naming:
  FunctionNaming:
    active: true
    # Convention Compose : les fonctions @Composable sont nommées en PascalCase, comme des types.
    ignoreAnnotated: ['Composable']

style:
  MaxLineLength:
    active: true
    maxLineLength: 120
  UnusedPrivateFunction:
    active: true
    # Convention Compose : une fonction @Preview n'est appelée que par l'outillage Android
    # Studio, jamais par du code du module — un faux positif classique de cette règle.
    ignoreAnnotated: ['Preview']

complexity:
  LongParameterList:
    active: true
    # Convention Hilt/Dagger (étape 11) : un `@Provides` prend un paramètre par type de
    # dépendance distinct nécessaire à la construction (ex. la table des onze exécuteurs
    # d'effets) ; regrouper ces paramètres en objets artificiels rien que pour la fonction de
    # câblage n'améliorerait pas la lisibilité, contrairement à un vrai constructeur métier.
    ignoreAnnotated: ['Provides']
  CyclomaticComplexMethod:
    active: true
    # Une fonction dont le corps est *un seul* `when` exhaustif sur une énumération est une table
    # de correspondance, pas de la logique ramifiée : sa complexité mesurée ne fait que compter
    # les valeurs de l'énumération. `ReadinessMessages.forCheck` en a quatorze, une par contrôle
    # de SPEC_ANDROID §13. L'alternative — une `Map` — ferait perdre l'exhaustivité vérifiée à la
    # compilation, qui est précisément la propriété de sûreté recherchée ici. L'exemption est
    # volontairement `ignoreSingleWhenExpression` et non `ignoreSimpleWhenEntries` : elle ne
    # pardonne rien à une fonction qui mêlerait un `when` à d'autres branchements.
    ignoreSingleWhenExpression: true
