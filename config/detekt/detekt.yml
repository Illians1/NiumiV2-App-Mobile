naming:
  FunctionNaming:
    active: true
    # Convention Compose : les fonctions @Composable sont nommées en PascalCase, comme des types.
    ignoreAnnotated: ['Composable']

style:
  MaxLineLength:
    active: true
    maxLineLength: 120
  UnusedPrivateFunction:
    active: true
    # Convention Compose : une fonction @Preview n'est appelée que par l'outillage Android
    # Studio, jamais par du code du module — un faux positif classique de cette règle.
    ignoreAnnotated: ['Preview']
