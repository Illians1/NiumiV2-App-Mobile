<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Écran 8 · Confirmation, le matin</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FAFAF8}a:hover{color:#FAFAF8}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
</style>
</head>
<body>
<div style="position: relative; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 34px; display: flex; flex-direction: column; background: #0E0E10; color: #FAFAF8; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.35">
<div aria-hidden="true" style="display: contents">
<div style="margin-top: 60px; display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="font-size: 16px; color: #A9A9AE">Vendredi 2 octobre</div>
<div style="font-size: 112px; font-weight: 500; line-height: 1; letter-spacing: -4px">7:00</div>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center">
<svg viewBox="0 0 342 220" width="264" height="170" role="img" aria-label="Un téléphone approché d'un Niumi Point" style="fill: none; stroke: #FAFAF8; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round">
<rect x="46" y="20" width="96" height="180" rx="18" style="fill: #0E0E10"></rect>
<path d="M82 36h24"></path>
<path d="M156 96q10 14 0 28"></path>
<path d="M168 84q20 26 0 52"></path>
<path d="M180 72q30 38 0 76"></path>
<rect x="212" y="50" width="120" height="120" rx="26"></rect>
<circle cx="304" cy="78" r="8" style="fill: #E9A23B; stroke: none"></circle>
</svg>
<div style="max-width: 300px; font-size: 30px; font-weight: 600; line-height: 1.15; letter-spacing: -0.5px">Scanne ton Niumi Point</div>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 6px">
<button style="width: 100%; height: 56px; box-sizing: border-box; border-radius: 14px; font-size: 17px; font-weight: 500; text-align: center; background: #FAFAF8; color: #0E0E10">Scanner le Niumi Point</button>
<button style="min-height: 44px; padding: 0 12px; font-size: 14px; color: #A9A9AE; text-decoration: underline; text-underline-offset: 4px">Je n'ai pas accès à mon Niumi Point</button>
</div>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(0, 0, 0, 0.6)"></div>
<div role="dialog" aria-label="Sortie de secours" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 24px 34px; border-radius: 28px 28px 0 0; background: #1B1B1F; box-shadow: 0 0 0 1px #2E2E33; display: flex; flex-direction: column">
<div aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #4A4A50"></div>
<div style="margin-top: 22px; font-size: 24px; font-weight: 600; line-height: 1.2; letter-spacing: -0.5px">Sortir de la session sans scanner ton Niumi Point ?</div>
<div style="margin-top: 12px; font-size: 16px; color: #A9A9AE">L'alarme s'arrêtera et tes applications seront débloquées. Pour sortir, tu devras recopier un long texte.</div>
<div style="margin-top: 24px">
<div style="display: flex; flex-direction: column; gap: 12px">
<button style="width: 100%; height: 56px; border-radius: 14px; background: #FAFAF8; color: #0E0E10; font-size: 17px; font-weight: 500; text-align: center">Rester dans la session</button>
<button style="width: 100%; height: 56px; box-sizing: border-box; border: 1px solid #FAFAF8; border-radius: 14px; font-size: 17px; font-weight: 500; text-align: center">Recopier le texte</button>
</div>
</div>
</div>
</div>
</body>
</html>
