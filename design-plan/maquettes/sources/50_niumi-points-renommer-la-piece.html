<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Niumi Points · Renommer la pièce</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E0E10}a:hover{color:#0E0E10}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
</style>
</head>
<body>
<div style="position: relative; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 34px; display: flex; flex-direction: column; background: #FAFAF8; color: #0E0E10; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.35">
<div aria-hidden="true" style="display: contents">
<div style="height: 44px; display: flex; align-items: center"><button aria-label="Retour aux réglages" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="fill: none; stroke: #0E0E10; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M15 5l-7 7 7 7"></path></svg></button></div>
<div style="margin-top: 8px; font-size: 28px; font-weight: 600; line-height: 1.15; letter-spacing: -0.5px">Niumi Points</div>
<div style="margin-top: 28px; display: flex; flex-direction: column">
<div style="height: 72px; border-top: 1px solid #DCDCD8; display: flex; align-items: center; gap: 14px"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" style="flex: none; fill: none; stroke: #0E0E10; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="16.5" cy="7.5" r="2" style="fill: #E9A23B; stroke: none"></circle></svg><span style="flex: 1 1 0; min-width: 0; font-size: 17px; font-weight: 500">Salle de bain</span><button aria-label="Actions pour le Niumi Point : Salle de bain" aria-haspopup="menu" aria-expanded="false" style="flex: none; width: 44px; height: 44px; margin-right: -10px; border-radius: 22px; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: #0E0E10"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button></div>
<div style="height: 72px; border-top: 1px solid #DCDCD8; display: flex; align-items: center; gap: 14px"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" style="flex: none; fill: none; stroke: #0E0E10; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="16.5" cy="7.5" r="2" style="fill: #E9A23B; stroke: none"></circle></svg><span style="flex: 1 1 0; min-width: 0; font-size: 17px; font-weight: 500">Cuisine</span><button aria-label="Actions pour le Niumi Point : Cuisine" aria-haspopup="menu" aria-expanded="false" style="flex: none; width: 44px; height: 44px; margin-right: -10px; border-radius: 22px; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: #0E0E10"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button></div>
<button style="width: 100%; height: 64px; border-top: 1px solid #DCDCD8; border-bottom: 1px solid #DCDCD8; display: flex; align-items: center; gap: 14px; font-weight: 500"><span style="flex: none; width: 30px; display: flex; justify-content: center"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="flex: none; fill: none; stroke: #0E0E10; stroke-width: 1.8; stroke-linecap: round"><path d="M12 5v14M5 12h14"></path></svg></span><span>Ajouter un Niumi Point</span></button>
</div>
<div style="margin-top: 14px; font-size: 13px; color: #5C5C60">N'importe lequel de tes Niumi Points arrête l'alarme.</div>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(0, 0, 0, 0.45)"></div>
<div role="dialog" aria-label="Renommer la pièce" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 24px 34px; border-radius: 28px 28px 0 0; background: #FFFFFF; display: flex; flex-direction: column">
<div aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #C6C6C2"></div>
<div style="margin-top: 18px; text-align: center; font-size: 24px; font-weight: 600; line-height: 1.2; letter-spacing: -0.5px">Où est ton Niumi Point ?</div>
<div style="margin-top: 18px">
<div role="radiogroup" aria-label="Pièce du Niumi Point" style="width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button role="radio" aria-checked="false" style="height: 96px; box-sizing: border-box; border: 1px solid #85858A; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" style="fill: none; stroke: #0E0E10; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M3 12h18v3a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"></path><path d="M6 12V6a2 2 0 0 1 4 0"></path><path d="M7 19l-1 2M17 19l1 2"></path></svg><span>Salle de bain</span></button>
<button role="radio" aria-checked="true" style="height: 96px; border-radius: 16px; background: #0E0E10; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-weight: 600"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" style="fill: none; stroke: #FAFAF8; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M5 10h14v6a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z"></path><path d="M3 10h18"></path><path d="M9 6V5M12 6V3M15 6V5"></path></svg><span>Cuisine</span></button>
<button role="radio" aria-checked="false" style="height: 96px; box-sizing: border-box; border: 1px solid #85858A; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" style="fill: none; stroke: #0E0E10; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M6 11V8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v3"></path><path d="M3 13a2 2 0 0 1 4 0v2h10v-2a2 2 0 0 1 4 0v5H3z"></path></svg><span>Salon</span></button>
<button role="radio" aria-checked="false" style="height: 96px; box-sizing: border-box; border: 1px solid #85858A; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" style="fill: none; stroke: #0E0E10; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M7 21V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v17"></path><path d="M4 21h16"></path><path d="M14 12v1"></path></svg><span>Entrée</span></button>
<button style="grid-column: 1 / -1; height: 52px; box-sizing: border-box; border: 1px solid #85858A; border-radius: 16px; text-align: center">Une autre pièce</button>
</div>
</div>
<div style="margin-top: 18px">
<button style="width: 100%; height: 56px; border-radius: 14px; background: #0E0E10; color: #FFFFFF; font-size: 17px; font-weight: 500; text-align: center">Enregistrer</button>
</div>
</div>
</div>
</body>
</html>
