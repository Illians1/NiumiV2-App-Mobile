<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Écran 3 bis · Temps pour sortir du lit</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E0E10}a:hover{color:#0E0E10}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 34px; display: flex; flex-direction: column; background: #FAFAF8; color: #0E0E10; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.35">
<div style="margin-top: 24px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 28px; font-weight: 600; line-height: 1.15; letter-spacing: -0.5px">Combien de temps mets-tu pour sortir du lit ?</div>
<div style="font-size: 16px; color: #5C5C60">Compte à partir de la première sonnerie. Une estimation suffit.</div>
</div>
<div style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
<div role="listbox" aria-label="Temps pour sortir du lit" style="width: 220px; display: flex; flex-direction: column; align-items: center">
<div style="height: 44px; display: flex; align-items: center; font-size: 20px; color: #C6C6C2">5 min</div>
<div style="height: 48px; display: flex; align-items: center; font-size: 24px; color: #85858A">10 min</div>
<div role="option" aria-selected="true" style="width: 100%; height: 72px; box-sizing: border-box; border-top: 1.5px solid #0E0E10; border-bottom: 1.5px solid #0E0E10; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 600; letter-spacing: -1px">15 min</div>
<div style="height: 48px; display: flex; align-items: center; font-size: 24px; color: #85858A">20 min</div>
<div style="height: 44px; display: flex; align-items: center; font-size: 20px; color: #C6C6C2">30 min</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 13px; color: #5C5C60">Niumi s'en servira pour te montrer le temps que tu gagnes.</div>
<button style="width: 100%; height: 56px; border-radius: 14px; background: #0E0E10; color: #FFFFFF; font-size: 17px; font-weight: 500; text-align: center">Continuer</button>
</div>
</div>
</body>
</html>
