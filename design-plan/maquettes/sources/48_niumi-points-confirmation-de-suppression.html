<!doctype html>

<body>
<div style="position: relative; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 34px; display: flex; flex-direction: column; background: #FAFAF8; color: #0E0E10; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.35">

<div style="margin-top: 12px; font-size: 16px; color: #5C5C60">Pour l'utiliser de nouveau, il faudra le scanner et l'ajouter.</div>

<button style="width: 100%; height: 56px; box-sizing: border-box; border: 1px solid #0E0E10; border-radius: 14px; font-size: 17px; font-weight: 500; text-align: center">Annuler</button>
